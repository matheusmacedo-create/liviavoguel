<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área da modelo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container conta" id="painel" hidden>
    <nav class="lateral" id="lateral">
      <a href="#inicio">Painel</a>
      <a href="#transmitir">Transmitir</a>
      <a href="#ganhos">Ganhos</a>
      <a href="#perfil">Meu perfil</a>
      <a href="#sala">Configurar sala</a>
      <a href="#chat">Chat</a>
      <a href="#seguranca">Senha e acesso</a>
    </nav>
    <section id="conteudo"></section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/modelos.js"></script>
  <script src="assets/js/perfis.js"></script>
  <script src="assets/js/salas.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    /*
     * ÁREA DA MODELO
     * Só abre com o login da modelo (modelo-entrar.html → api/modelo-entrar.php), que é
     * separado do login de cliente. Ganhos, status e edição do perfil ainda são visuais:
     * quando ganharem endpoints, cada um confere a sessão da modelo no servidor (lv_exigir_modelo).
     */
    LV.montar("");
    const { esc, reais } = LV;
    const S = window.SITE;
    let conta = null; // { slug, nome, email } da modelo logada
    let m = null;     // dados públicos dela, de modelos.js
    const conteudo = document.getElementById("conteudo");
    // ---------- Ao vivo (api/modelo-ao-vivo.php) ----------
    // Ligado, o painel avisa o servidor a cada minuto que continua aberto. Se a modelo fechar
    // o painel sem desligar, o site a mostra offline sozinho em 5 minutos (LV_AO_VIVO_VALIDADE).
    let aoVivo = false;
    let avisos = null;
    const online = () => aoVivo;

    async function carregarAoVivo() {
      if (S.modoDemo) return (aoVivo = LV.ler("lv_painel_online", m.online ? "1" : "0") === "1");
      try {
        const r = await fetch("api/ao-vivo.php", { credentials: "same-origin" }).then((x) => x.json());
        aoVivo = !!(r.modelos && r.modelos[m.slug] && r.modelos[m.slug].online);
      } catch { aoVivo = false; }
      return aoVivo;
    }

    async function definirAoVivo(ligar) {
      if (S.modoDemo) LV.gravar("lv_painel_online", ligar ? "1" : "0");
      else aoVivo = (await LV.api("modelo-ao-vivo.php", { online: ligar })).online;
      if (S.modoDemo) aoVivo = ligar;
      clearInterval(avisos);
      if (aoVivo && !S.modoDemo) {
        avisos = setInterval(() => {
          LV.api("modelo-ao-vivo.php", { online: true }).catch((err) => {
            if (err.status === 401) location.replace("modelo-entrar.html");
          });
        }, 60000);
      }
      return aoVivo;
    }

    // ---------- Ganhos (api/modelo-ganhos.php) ----------
    // O servidor soma as gorjetas e os minutos de privado que a modelo recebeu e converte
    // para reais pelo repasse (MODELO_REPASSE_CENTAVOS no config.php). No modo demonstração,
    // a conta é feita aqui com o extrato simulado deste navegador.
    const PERIODOS = { "7d": "Últimos 7 dias", mes: "Este mês", mes_passado: "Mês passado" };
    let periodo = "7d";
    let ganhos = null; // última resposta de modelo-ganhos.php
    const dinheiro = (centavos) => reais(centavos / 100);
    const tipoTexto = (t) => (t === "privado" ? "Privado (1 min)" : "Gorjeta");
    // Sempre no horário de Brasília, como as somas de "hoje" e "este mês" no servidor.
    const horaBrasilia = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" });

    function ganhosDemo(nome) {
      const repasse = 20;
      const agora = new Date();
      const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
      const inicio = { "7d": new Date(hoje - 6 * 864e5), mes: new Date(agora.getFullYear(), agora.getMonth(), 1),
        mes_passado: new Date(agora.getFullYear(), agora.getMonth() - 1, 1) };
      const fim = { mes_passado: new Date(agora.getFullYear(), agora.getMonth(), 1) };
      const recebidos = LV.extrato()
        .filter((l) => l.valor < 0 && l.descricao.includes(m.nome))
        .map((l) => ({ data: l.data, tipo: l.descricao.startsWith("Show privado") ? "privado" : "gorjeta",
          cliente: (LV.usuario() || {}).apelido || "você", creditos: -l.valor, centavos: -l.valor * repasse }));
      const soma = (de, ate, tipo) => {
        const lista = recebidos.filter((l) => (!de || new Date(l.data) >= de) && (!ate || new Date(l.data) < ate) && (!tipo || l.tipo === tipo));
        const creditos = lista.reduce((t, l) => t + l.creditos, 0);
        return { creditos, centavos: creditos * repasse, quantidade: lista.length, lista };
      };
      const p = soma(inicio[nome], fim[nome]);
      return {
        repasse_centavos: repasse,
        resumo: { hoje: soma(hoje), mes: soma(inicio.mes), total: soma(), privado_mes: soma(inicio.mes, null, "privado") },
        periodo: { nome, soma: p, lancamentos: p.lista },
        ultimas: recebidos.slice(0, 5)
      };
    }

    async function carregarGanhos() {
      if (S.modoDemo) return (ganhos = ganhosDemo(periodo));
      try {
        ganhos = await LV.api("modelo-ganhos.php?periodo=" + encodeURIComponent(periodo));
      } catch (err) {
        if (err.status === 401) location.replace("modelo-entrar.html");
        ganhos = null;
        LV.toast(err.message);
      }
      return ganhos;
    }

    function tabelaGanhos(lista, vazio) {
      if (!lista.length) return `<div class="vazio"><div class="icone">💸</div>${vazio}</div>`;
      return `<div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Data</th><th>De</th><th>Tipo</th><th class="col-opcional" style="text-align:right">Créditos</th><th style="text-align:right">Você recebe</th></tr></thead>
        <tbody>${lista.map((l) => `
          <tr><td>${horaBrasilia(l.data)}</td><td>${esc(l.cliente)}</td><td>${tipoTexto(l.tipo)}</td>
          <td class="col-opcional" style="text-align:right">${l.creditos}</td><td style="text-align:right;white-space:nowrap" class="mais">${dinheiro(l.centavos)}</td></tr>`).join("")}
        </tbody></table></div>`;
    }
    const semGanhos = `<div class="vazio"><div class="icone">⚠️</div>Não foi possível carregar os ganhos agora. <a class="link" href="#" data-recarregar>Tentar de novo</a></div>`;

    const secoes = {
      inicio: () => `
        <div class="painel-topo">
          <h1>Olá, ${esc(m.nome.split(" ")[0])} 👋</h1>
          <label class="chave"><input type="checkbox" id="status" ${online() ? "checked" : ""}><span class="trilho"></span><span id="status-txt">${online() ? "Ao vivo" : "Offline"}</span></label>
        </div>
        <div class="ajuda" id="status-ajuda" style="color:var(--texto-2);font-size:.85rem;margin:-6px 0 16px">
          ${online() ? "Sua sala aparece como ao vivo no site. Deixe esta página aberta enquanto estiver transmitindo." : "Ligue quando começar a transmitir. Sua sala passa a aparecer como ao vivo no site."}
        </div>
        ${ganhos ? `
        <div class="cards-numeros">
          <div class="numero destaque"><small>Ganhos hoje</small><strong>${dinheiro(ganhos.resumo.hoje.centavos)}</strong></div>
          <div class="numero"><small>Ganhos no mês</small><strong>${dinheiro(ganhos.resumo.mes.centavos)}</strong></div>
          <div class="numero"><small>Gorjetas no mês</small><strong>${ganhos.resumo.mes.quantidade - ganhos.resumo.privado_mes.quantidade}</strong></div>
          <div class="numero"><small>Minutos de privado (mês)</small><strong>${ganhos.resumo.privado_mes.quantidade}</strong></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Últimos recebimentos</h2><a class="link" href="#ganhos">Ver tudo</a></div>
          ${tabelaGanhos(ganhos.ultimas, "Nenhuma gorjeta ainda. Elas aparecem aqui quando você estiver ao vivo.")}
        </div>` : semGanhos}
        <div class="painel">
          <h2>Próximas transmissões</h2>
          <ul class="lista-agenda">${m.agenda.map((a) => `<li><span>${esc(a.dia)}</span><strong>${esc(a.hora)}</strong></li>`).join("")}</ul>
        </div>`,

      transmitir: () => `
        <div class="painel">
          <h2>Como transmitir pelo OBS</h2>
          <ol class="instrucoes" style="margin-top:0">
            <li>Instale o <strong>OBS Studio</strong> (grátis) no computador.</li>
            <li>No OBS, vá em <strong>Configurações → Transmissão</strong> e escolha <strong>Personalizado</strong>.</li>
            <li>Cole o <strong>Servidor</strong> e a <strong>Chave de transmissão</strong> abaixo.</li>
            <li>Clique em <strong>Iniciar transmissão</strong>. Em alguns segundos você aparece como ao vivo.</li>
          </ol>
        </div>
        <div class="painel">
          <h2>Dados de transmissão</h2>
          ${transmissao && transmissao.configurada ? `
          <div class="campo"><label>Servidor (RTMP)</label>
            <div class="segredo"><input readonly value="${esc(transmissao.rtmp_servidor)}" id="rtmp"><button class="btn btn-pequeno" data-copiar="rtmp">Copiar</button></div></div>
          <div class="campo"><label>Chave de transmissão</label>
            <div class="segredo"><input readonly type="password" value="${esc(transmissao.rtmp_chave)}" id="chave"><button class="btn btn-pequeno" id="mostrar">Mostrar</button><button class="btn btn-pequeno" data-copiar="chave">Copiar</button></div>
            <span class="ajuda">Nunca compartilhe a chave. Com ela, qualquer pessoa transmite na sua sala.</span></div>
          <p style="color:var(--texto-2);font-size:.85rem">Depois de iniciar no OBS, ligue o botão <strong>Ao vivo</strong> no Painel para a sua sala aparecer no site.</p>`
          : `<div class="vazio"><div class="icone">📡</div>${S.modoDemo ? "No modo demonstração não há dados de transmissão." : "A equipe ainda não configurou a sua transmissão."}<br>Assim que configurar, o servidor e a chave aparecem aqui.</div>`}
        </div>
        <div class="painel">
          <h2>Configuração recomendada</h2>
          <div class="privado-info" style="margin:0">
            <div><span>Resolução</span><strong>1280×720 (720p)</strong></div>
            <div><span>Taxa de quadros</span><strong>30 fps</strong></div>
            <div><span>Bitrate de vídeo</span><strong>2500 a 3500 kbps</strong></div>
            <div><span>Internet de upload mínima</span><strong>5 Mbps</strong></div>
          </div>
        </div>`,

      ganhos: () => !ganhos ? semGanhos : `
        <div class="cards-numeros">
          <div class="numero destaque"><small>Hoje</small><strong>${dinheiro(ganhos.resumo.hoje.centavos)}</strong></div>
          <div class="numero"><small>Este mês</small><strong>${dinheiro(ganhos.resumo.mes.centavos)}</strong></div>
          <div class="numero"><small>Total desde o início</small><strong>${dinheiro(ganhos.resumo.total.centavos)}</strong></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Extrato</h2>
            <select class="btn btn-pequeno" id="periodo" aria-label="Período">
              ${Object.entries(PERIODOS).map(([v, t]) => `<option value="${v}" ${v === periodo ? "selected" : ""}>${t}</option>`).join("")}
            </select></div>
          <div class="privado-info" style="margin:0 0 14px">
            <div><span>${PERIODOS[periodo]}</span><strong>${ganhos.periodo.soma.creditos} créditos · ${dinheiro(ganhos.periodo.soma.centavos)}</strong></div>
          </div>
          ${tabelaGanhos(ganhos.periodo.lancamentos, "Nenhum ganho neste período.")}
          <p style="color:var(--texto-2);font-size:.85rem;margin-top:12px">Cada crédito recebido vale ${dinheiro(ganhos.repasse_centavos)} para você. Horários de Brasília.</p>
        </div>
        ${secaoSaques()}`,

      perfil: () => `
        <form class="painel" id="form-perfil" novalidate>
          <h2>Meu perfil</h2>
          <p style="color:var(--texto-2);margin-bottom:14px">O que você salvar aqui aparece na página inicial e na sua sala.</p>
          <div class="linha">
            <div class="campo"><label for="p-nome">Nome artístico</label><input id="p-nome" value="${esc(m.nome)}" maxlength="40"></div>
            <div class="campo"><label for="p-cidade">Cidade</label><input id="p-cidade" value="${esc(m.cidade)}" maxlength="60"></div>
          </div>
          <div class="campo"><label for="p-bio">Sobre mim</label><textarea id="p-bio" maxlength="600">${esc(m.bio)}</textarea><span class="ajuda">Até 600 caracteres</span></div>
          <div class="linha">
            <div class="campo"><label for="p-tags">Interesses (separados por vírgula)</label><input id="p-tags" value="${esc(m.tags.join(", "))}"><span class="ajuda">Até 10</span></div>
            <div class="campo"><label for="p-idiomas">Idiomas (separados por vírgula)</label><input id="p-idiomas" value="${esc(m.idiomas.join(", "))}"><span class="ajuda">De 1 a 5</span></div>
          </div>
          <button class="btn btn-primario" id="salvar-perfil">Salvar perfil</button>
        </form>
        ${secaoFotos()}`,

      chat: () => S.modoDemo ? `
        <div class="painel"><h2>Chat da sala</h2>
          <div class="vazio"><div class="icone">💬</div>No modo demonstração, o chat fica só no navegador de cada pessoa.<br>A moderação funciona quando o servidor estiver no ar.</div></div>` : `
        <div class="painel">
          <div class="painel-topo"><h2>Chat da sala</h2><small style="color:var(--texto-2)">Atualiza sozinho</small></div>
          <p style="color:var(--texto-2);font-size:.9rem;margin-bottom:14px"><strong>Apagar</strong> tira a mensagem da tela de todos.
            <strong>Bloquear</strong> impede a pessoa de escrever na sua sala e apaga as mensagens dela; ela ainda pode mandar gorjeta, sem recado.</p>
          <div id="mod-msgs"><div class="vazio"><span class="girando" style="display:inline-block"></span></div></div>
        </div>
        <div class="painel"><h2>Bloqueados</h2><div id="mod-bloqueados"></div></div>`,

      seguranca: () => `
        <form class="painel" id="form-senha" novalidate>
          <h2>Trocar senha</h2>
          <p style="color:var(--texto-2);margin-bottom:14px">Você está conectada como <strong>${esc(conta.email)}</strong>.</p>
          <div class="linha">
            <div class="campo"><label for="senha-atual">Senha atual</label><input id="senha-atual" type="password" autocomplete="current-password"></div>
            <div class="campo"><label for="senha-nova">Nova senha</label><input id="senha-nova" type="password" autocomplete="new-password" minlength="8"><span class="ajuda">8 caracteres ou mais</span></div>
          </div>
          <button class="btn btn-primario">Trocar senha</button>
        </form>
        <div class="painel">
          <h2>Sair</h2>
          <p style="color:var(--texto-2);margin-bottom:14px">Por segurança, o acesso vence sozinho em 12 horas. Em computador de outra pessoa, saia sempre ao terminar.</p>
          <button class="btn perigo" id="sair-modelo">Sair da área da modelo</button>
        </div>`,

      sala: () => `
        <form class="painel" id="form-sala" novalidate>
          <h2>Configurar sala</h2>
          <p style="color:var(--texto-2);margin-bottom:14px">Vale na hora para a sua sala. O preço do privado é o que o site cobra de quem te chama.</p>
          <div class="campo"><label for="s-privado">Preço do privado (créditos por minuto)</label>
            <input id="s-privado" type="number" min="1" max="500" step="1" inputmode="numeric" value="${m.precoPrivado}">
            <span class="ajuda">De 1 a 500. Cada crédito vale ${ganhos ? dinheiro(ganhos.repasse_centavos) : "R$ 0,20"} para você.</span></div>
          <div class="linha">
            <div class="campo"><label for="s-meta">Título da meta de gorjetas</label><input id="s-meta" value="${esc(m.meta?.titulo ?? "")}" maxlength="60" placeholder="ex.: Dança especial"></div>
            <div class="campo"><label for="s-alvo">Valor da meta (créditos)</label><input id="s-alvo" type="number" min="1" max="100000" step="1" inputmode="numeric" value="${m.meta?.alvo ?? ""}"></div>
          </div>
          ${m.meta ? `<div class="privado-info" style="margin:-4px 0 14px"><div><span>Progresso da meta</span><strong>${Math.min(m.meta.atual ?? 0, m.meta.alvo)} de ${m.meta.alvo} créditos</strong></div></div>` : ""}
          <span class="ajuda" style="display:block;color:var(--texto-2);font-size:.8rem;margin:-6px 0 14px">Para tirar a meta, apague o título e o valor. Trocar o título ou o valor recomeça a contagem do zero.</span>
          <div class="campo"><label for="s-boas">Mensagem de boas-vindas no chat</label><input id="s-boas" maxlength="120" value="${esc(m.boasVindas || "")}" placeholder="Bem-vindo(a) à minha sala! 💜"></div>
          <div class="campo"><label for="s-bloq">Palavras bloqueadas no chat (separadas por vírgula)</label><input id="s-bloq" value="${esc((m.bloqueadas || []).join(", "))}" placeholder="ex.: telefone, whatsapp">
            <span class="ajuda">Mensagens e recados com essas palavras não são enviados. Até 30.</span></div>
          <button class="btn btn-primario" id="salvar-sala">Salvar</button>
        </form>`
    };

    // Dados do OBS (api/modelo-transmitir.php): só a própria modelo vê a chave.
    let transmissao = null;

    // ---------- Fotos (api/modelo-fotos.php) ----------
    // A primeira foto vira a capa (página inicial, avatar e player); as outras formam a galeria da sala.
    let fotos = null;
    let maxFotos = 12;
    async function carregarFotos() {
      if (S.modoDemo) return (fotos = null);
      try { const r = await LV.api("modelo-fotos.php"); fotos = r.fotos; maxFotos = r.max; } catch (err) {
        if (err.status === 401) location.replace("modelo-entrar.html");
        fotos = null;
      }
    }
    function secaoFotos() {
      if (S.modoDemo) {
        return `<div class="painel"><h2>Fotos</h2>
          <div class="galeria">${[m.foto, ...m.galeria].map((f) => `<img src="${esc(f)}" alt="">`).join("")}</div>
          <p style="color:var(--texto-2);font-size:.85rem;margin-top:10px">No modo demonstração não dá para enviar fotos. Com o servidor no ar, você envia aqui.</p></div>`;
      }
      if (!fotos) return `<div class="painel"><h2>Fotos</h2>${semGanhos.replace("os ganhos", "as fotos")}</div>`;
      return `<div class="painel">
        <div class="painel-topo"><h2>Fotos</h2><small style="color:var(--texto-2)">${fotos.length} de ${maxFotos}</small></div>
        <p style="color:var(--texto-2);font-size:.9rem;margin-bottom:14px">A <strong>capa</strong> aparece na página inicial e na sua sala; as outras formam a galeria. JPG, PNG ou WebP, até 5 MB cada.</p>
        ${fotos.length ? `<div class="grade-fotos">${fotos.map((f) => `
          <figure class="foto-item ${f.capa ? "capa" : ""}">
            <img src="${esc(f.url)}" alt="" loading="lazy">
            ${f.capa ? `<span class="selo-capa">Capa</span>` : ""}
            <figcaption>
              ${f.capa ? "" : `<button class="btn btn-pequeno" data-foto-capa="${f.id}">Usar como capa</button>`}
              <button class="btn btn-pequeno perigo" data-foto-apagar="${f.id}">Apagar</button>
            </figcaption>
          </figure>`).join("")}</div>` : `<div class="vazio"><div class="icone">📷</div>Nenhuma foto enviada ainda.</div>`}
        <label class="btn btn-primario" style="margin-top:14px;${fotos.length >= maxFotos ? "opacity:.5;pointer-events:none" : ""}">
          📷 Enviar fotos<input type="file" id="enviar-fotos" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
        <span id="progresso-fotos" style="color:var(--texto-2);font-size:.85rem;margin-left:10px"></span>
      </div>`;
    }
    async function aplicarFotosNoSite() {
      // Atualiza a capa/galeria usadas nas outras abas deste painel (e o cache de perfis.js).
      if (fotos && fotos.length) LVPerfis.aplicar({ [m.slug]: { foto: fotos[0].url, galeria: fotos.slice(1).map((f) => f.url) } });
    }
    conteudo.addEventListener("change", async (e) => {
      if (e.target.id !== "enviar-fotos") return;
      const arquivos = [...e.target.files].slice(0, Math.max(0, maxFotos - fotos.length));
      const progresso = document.getElementById("progresso-fotos");
      let enviadas = 0;
      for (const arq of arquivos) {
        if (arq.size > 5 * 1024 * 1024) { LV.toast(`${arq.name}: a foto pode ter até 5 MB.`); continue; }
        progresso.textContent = `Enviando ${enviadas + 1} de ${arquivos.length}...`;
        const dados = new FormData();
        dados.append("foto", arq);
        try {
          const resp = await fetch("api/modelo-fotos.php", { method: "POST", body: dados, credentials: "same-origin", headers: { "X-LV-Envio": "1", Accept: "application/json" } });
          const r = await resp.json().catch(() => ({}));
          if (resp.status === 401) return location.replace("modelo-entrar.html");
          if (!resp.ok) { LV.toast(`${arq.name}: ${r.erro || "não deu para enviar."}`); continue; }
          fotos = r.fotos;
          enviadas++;
        } catch { LV.toast(`${arq.name}: falha de conexão.`); }
      }
      if (enviadas) LV.toast(enviadas === 1 ? "Foto enviada!" : `${enviadas} fotos enviadas!`);
      aplicarFotosNoSite();
      abrir();
    });
    conteudo.addEventListener("click", async (e) => {
      const capa = e.target.closest("[data-foto-capa]");

    // ---------- Saques (api/modelo-saque.php) ----------
    // A modelo salva a chave Pix e pede o saque de tudo o que está disponível; a equipe paga e marca como pago.
    let saques = null;
    const TIPOS_PIX = { cpf: "CPF", email: "E-mail", celular: "Celular", aleatoria: "Chave aleatória" };
    const STATUS_SAQUE = { pendente: ["⏳ Esperando pagamento", "#ffc94a"], pago: ["✓ Pago", "var(--verde)"], recusado: ["✕ Recusado", "#ff7a90"] };
    async function carregarSaques() {
      if (S.modoDemo) return (saques = null);
      try { saques = await LV.api("modelo-saque.php"); } catch (err) {
        if (err.status === 401) location.replace("modelo-entrar.html");
        saques = null;
      }
    }
    function secaoSaques() {
      if (S.modoDemo) {
        return `<div class="painel"><h2>Saques</h2><div class="vazio"><div class="icone">🏦</div>
          No modo demonstração não há saques.<br>Com o servidor no ar, aqui você cadastra a chave Pix e pede o saque.</div></div>`;

      if (!saques) return `<div class="painel"><h2>Saques</h2>${semGanhos}</div>`;
      const d = saques.disponivel;
      const pendente = saques.saques.some((x) => x.status === "pendente");
      const liberaEm = saques.pix?.saque_liberado_em;
      const podePedir = saques.pix && !liberaEm && !pendente && d.centavos >= saques.minimo_centavos;
      const motivo = !saques.pix ? "Cadastre a chave Pix abaixo para pedir saques."
        : liberaEm ? `Por segurança, o saque fica liberado 24 horas depois de cadastrar ou trocar a chave Pix: ${horaBrasilia(liberaEm)}.`
        : pendente ? "Você já tem um saque esperando pagamento."
        : d.centavos < saques.minimo_centavos ? `O saque mínimo é de ${dinheiro(saques.minimo_centavos)}.` : "";
      const espera = d.em_espera?.centavos > 0
        ? `<p style="color:var(--texto-2);font-size:.85rem;margin-top:10px">Mais ${dinheiro(d.em_espera.centavos)} de ganhos recentes: cada gorjeta e minuto de privado fica disponível ${d.em_espera.dias} dias depois (prazo de contestação de pagamentos com cartão).</p>` : "";
      const estornos = d.estornados?.centavos > 0
        ? `<p style="color:var(--texto-2);font-size:.85rem;margin-top:10px">Já foram descontados ${dinheiro(d.estornados.centavos)} de pagamentos estornados pelos clientes.</p>` : "";
      return `
        <div class="painel">
          <div class="painel-topo"><h2>Saques</h2></div>
          <div class="cards-numeros" style="margin-bottom:14px">
            <div class="numero destaque"><small>Disponível para saque</small><strong>${dinheiro(d.centavos)}</strong></div>
            <div class="numero"><small>Créditos disponíveis</small><strong>${d.creditos}</strong></div>
          </div>
          <button class="btn btn-primario" id="pedir-saque" ${podePedir ? "" : "disabled"}>Pedir saque de ${dinheiro(d.centavos)}</button>
          ${motivo ? `<p class="ajuda" style="color:var(--texto-2);font-size:.85rem;margin-top:10px">${esc(motivo)}</p>` : ""}
          ${espera}${estornos}
          <p style="color:var(--texto-2);font-size:.85rem;margin-top:10px">O saque leva tudo o que está disponível. A equipe paga pelo Pix e o pedido aparece como pago aqui.</p>
        </div>
        <form class="painel" id="form-pix" novalidate>
          <h2>Chave Pix para receber</h2>
          <div class="linha">
            <div class="campo"><label for="tipo-chave">Tipo de chave</label><select id="tipo-chave">
              ${Object.entries(TIPOS_PIX).map(([v, t]) => `<option value="${v}" ${saques.pix?.tipo === v ? "selected" : ""}>${t}</option>`).join("")}
            </select></div>
            <div class="campo"><label for="chave-pix">Chave Pix</label><input id="chave-pix" value="${esc(saques.pix?.chave ?? "")}" maxlength="80" autocomplete="off"></div>
          </div>
          <div class="campo"><label for="senha-pix">Sua senha do painel</label><input id="senha-pix" type="password" autocomplete="current-password" maxlength="200"></div>
          <p style="color:var(--texto-2);font-size:.85rem;margin:0 0 10px">Por segurança, salvar a chave pede a senha, e o saque fica liberado 24 horas depois de cadastrar ou trocar a chave.</p>
          <button class="btn" id="salvar-pix">Salvar chave</button>
        </form>
        <div class="painel">
          <h2>Histórico de saques</h2>
          ${saques.saques.length ? `<div class="tabela-rolagem"><table class="tabela">
            <thead><tr><th>Pedido em</th><th style="text-align:right">Valor</th><th class="col-opcional">Chave</th><th>Situação</th></tr></thead>
            <tbody>${saques.saques.map((x) => `<tr>
              <td>${horaBrasilia(x.pedido_em)}</td>
              <td style="text-align:right;white-space:nowrap">${dinheiro(x.centavos)}</td>
              <td class="col-opcional">${esc(TIPOS_PIX[x.pix.tipo] || x.pix.tipo)}: ${esc(x.pix.chave)}</td>
              <td><span style="color:${STATUS_SAQUE[x.status]?.[1] || "inherit"};font-weight:600">${STATUS_SAQUE[x.status]?.[0] || esc(x.status)}</span>
                ${x.pago_em ? `<br><small style="color:var(--texto-2)">${horaBrasilia(x.pago_em)}</small>` : ""}
                ${x.observacao ? `<br><small style="color:var(--texto-2)">${esc(x.observacao)}</small>` : ""}</td>
            </tr>`).join("")}</tbody></table></div>`
            : `<div class="vazio"><div class="icone">🏦</div>Nenhum saque pedido ainda.</div>`}
        </div>`;
    }
    conteudo.addEventListener("submit", async (e) => {
      if (e.target.id !== "form-pix") return;
      e.preventDefault();
      marcarErro("chave-pix", "");
      marcarErro("senha-pix", "");
      try {
        saques = await LV.api("modelo-saque.php", { acao: "pix", tipo: document.getElementById("tipo-chave").value,
          chave: document.getElementById("chave-pix").value, senha_atual: document.getElementById("senha-pix").value });
        LV.toast("Chave Pix salva!");
        abrir();
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        if (err.campo === "chave") marcarErro("chave-pix", err.message);
        if (err.campo === "senha_atual") marcarErro("senha-pix", err.message);
        LV.toast(err.message);
      }
    });
    conteudo.addEventListener("click", (e) => {
      if (e.target.id !== "pedir-saque" || !saques) return;
      const md = LV.modal(`
        <div class="modal-icone">🏦</div>
        <h2>Pedir saque de ${dinheiro(saques.disponivel.centavos)}?</h2>
        <p>O valor vai para a chave ${esc(TIPOS_PIX[saques.pix.tipo])}: <strong>${esc(saques.pix.chave)}</strong>. Confira antes de confirmar.</p>
        <div class="acoes"><button class="btn btn-primario btn-bloco" id="confirmar-saque">Confirmar saque</button>
          <button class="btn btn-bloco" data-fechar>Cancelar</button></div>`);
      md.querySelector("#confirmar-saque").addEventListener("click", async () => {
        md.fechar();
        try {
          saques = await LV.api("modelo-saque.php", { acao: "pedir" });
          LV.toast("Saque pedido! Ele aparece como pago quando a equipe fizer o Pix.");
          abrir();
        } catch (err) {
          if (err.status === 401) return location.replace("modelo-entrar.html");
          LV.toast(err.message);
        }
      });
    });

    // ---------- Chat: moderação (api/modelo-chat.php) ----------
    let chatTimer = null;
    let modUltimo = 0;
    const modMsgs = new Map();
    function desenharModeracao(bloqueados) {
      const caixa = document.getElementById("mod-msgs");
      if (!caixa) return;
      const lista = [...modMsgs.values()].slice(-50).reverse(); // mais novas em cima
      caixa.innerHTML = lista.length ? `<div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Hora</th><th>De</th><th>Mensagem</th><th></th></tr></thead>
        <tbody>${lista.map((msg) => `<tr>
          <td style="white-space:nowrap">${horaBrasilia(msg.data).split(", ")[1] || ""}</td>
          <td>${esc(msg.apelido)}</td>
          <td>${msg.tipo === "gorjeta" ? `💸 ${Number(msg.creditos)} créditos${msg.texto ? ` · “${esc(msg.texto)}”` : ""}` : esc(msg.texto)}</td>
          <td style="text-align:right;white-space:nowrap">
            ${msg.tipo === "msg" || msg.texto ? `<button class="btn btn-pequeno" data-apagar="${msg.id}">Apagar</button>` : ""}
            ${msg.usuario ? `<button class="btn btn-pequeno perigo" data-bloquear="${msg.id}">Bloquear</button>` : ""}
          </td></tr>`).join("")}</tbody></table></div>`
        : `<div class="vazio"><div class="icone">💬</div>Nenhuma mensagem ainda.</div>`;
      if (bloqueados) {
        document.getElementById("mod-bloqueados").innerHTML = bloqueados.length
          ? `<ul class="lista-agenda">${bloqueados.map((b) => `<li><span>${esc(b.apelido)}</span>
              <button class="btn btn-pequeno" data-desbloquear="${b.usuario}">Desbloquear</button></li>`).join("")}</ul>`
          : `<p style="color:var(--texto-2)">Ninguém bloqueado.</p>`;
      }
    }
    async function carregarModeracao() {
      if (!document.getElementById("mod-msgs") || document.hidden) return;
      try {
        const r = await LV.api("modelo-chat.php?depois=" + modUltimo);
        r.mensagens.forEach((msg) => { modMsgs.set(msg.id, msg); modUltimo = Math.max(modUltimo, msg.id); });
        r.apagadas.forEach((id) => modMsgs.delete(id));
        desenharModeracao(r.bloqueados);
      } catch (err) {
        if (err.status === 401) location.replace("modelo-entrar.html");
      }
    }
    async function moderar(corpo) {
      try {
        const r = await LV.api("modelo-chat.php", corpo);
        r.apagadas.forEach((id) => modMsgs.delete(id));
        desenharModeracao(r.bloqueados);
        LV.toast({ apagar: "Mensagem apagada.", bloquear: "Pessoa bloqueada na sua sala.", desbloquear: "Pessoa desbloqueada." }[corpo.acao]);
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        LV.toast(err.message);
      }
    }
    conteudo.addEventListener("click", (e) => {
      const apagar = e.target.closest("[data-apagar]");
      const bloquear = e.target.closest("[data-bloquear]");
      const desbloquear = e.target.closest("[data-desbloquear]");
      if (apagar) moderar({ acao: "apagar", id: Number(apagar.dataset.apagar) });
      if (bloquear) {
        const msg = modMsgs.get(Number(bloquear.dataset.bloquear));
        const md = LV.modal(`
          <div class="modal-icone" style="color:#ff7a90">⛔</div>
          <h2>Bloquear ${esc(msg ? msg.apelido : "esta pessoa")}?</h2>
          <p>Ela não vai mais poder escrever na sua sala, e as mensagens dela somem. Você pode desbloquear depois.</p>
          <div class="acoes"><button class="btn btn-bloco perigo" id="confirmar-bloqueio">Bloquear</button>
            <button class="btn btn-bloco" data-fechar>Cancelar</button></div>`);
        md.querySelector("#confirmar-bloqueio").addEventListener("click", () => { md.fechar(); moderar({ acao: "bloquear", id: Number(bloquear.dataset.bloquear) }); });
      }
      if (desbloquear) moderar({ acao: "desbloquear", usuario: Number(desbloquear.dataset.desbloquear) });
    });

    async function abrir() {
      const nome = location.hash.slice(1) in secoes ? location.hash.slice(1) : "inicio";
      clearInterval(chatTimer);
      document.querySelectorAll("#lateral a").forEach((a) => a.classList.toggle("ativo", a.hash === "#" + nome));
      if (nome === "inicio" || nome === "ganhos") {
        conteudo.innerHTML = `<div class="vazio"><span class="girando" style="display:inline-block"></span><br>Carregando seus ganhos...</div>`;
        await Promise.all([carregarGanhos(), nome === "ganhos" ? carregarSaques() : null]);
        if ((location.hash.slice(1) || "inicio") !== nome && location.hash.slice(1) in secoes) return; // trocou de aba enquanto carregava
      }
      if (nome === "transmitir") {
        conteudo.innerHTML = `<div class="vazio"><span class="girando" style="display:inline-block"></span></div>`;
        transmissao = null;
        if (!S.modoDemo) {
          try { transmissao = await LV.api("modelo-transmitir.php"); } catch (err) { if (err.status === 401) return location.replace("modelo-entrar.html"); }
        }
        if ((location.hash.slice(1) || "inicio") !== nome && location.hash.slice(1) in secoes) return; // trocou de aba enquanto carregava
      }
      if (nome === "perfil") {
        conteudo.innerHTML = `<div class="vazio"><span class="girando" style="display:inline-block"></span></div>`;
        await carregarFotos();
        if ((location.hash.slice(1) || "inicio") !== nome && location.hash.slice(1) in secoes) return; // trocou de aba enquanto carregava
      }
      conteudo.innerHTML = secoes[nome]();
      if (nome === "chat" && !S.modoDemo) {
        modUltimo = 0;
        modMsgs.clear();
        carregarModeracao();
        chatTimer = setInterval(carregarModeracao, 3000);
      }
    }

    conteudo.addEventListener("change", async (e) => {
      if (e.target.id !== "periodo") return;
      periodo = e.target.value;
      abrir();
    });
    conteudo.addEventListener("click", (e) => {
      if (e.target.closest("[data-recarregar]")) { e.preventDefault(); abrir(); }
      const c = e.target.closest("[data-copiar]");
      if (c) { navigator.clipboard?.writeText(document.getElementById(c.dataset.copiar).value); LV.toast("Copiado!"); }
      if (e.target.id === "mostrar") {
        const k = document.getElementById("chave");
        k.type = k.type === "password" ? "text" : "password";
        e.target.textContent = k.type === "password" ? "Mostrar" : "Ocultar";
      }
    });
    conteudo.addEventListener("change", async (e) => {
      if (e.target.id !== "status") return;
      const chave = e.target;
      const ligar = chave.checked;
      chave.disabled = true;
      try {
        await definirAoVivo(ligar);
        LV.toast(aoVivo ? "Você está ao vivo!" : "Sala fechada.");
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        LV.toast(err.message);
      }
      chave.disabled = false;
      chave.checked = aoVivo;
      document.getElementById("status-txt").textContent = aoVivo ? "Ao vivo" : "Offline";
      document.getElementById("status-ajuda").textContent = aoVivo
        ? "Sua sala aparece como ao vivo no site. Deixe esta página aberta enquanto estiver transmitindo."
        : "Ligue quando começar a transmitir. Sua sala passa a aparecer como ao vivo no site.";
    });
    // ---------- Configurar sala (api/modelo-sala.php) ----------
    conteudo.addEventListener("submit", async (e) => {
      if (e.target.id !== "form-sala") return;
      e.preventDefault();
      const valor = (id) => document.getElementById(id).value.trim();
      const inteiro = (id) => (valor(id) === "" ? null : Number(valor(id)));
      const vistos = new Set();
      const sala = {
        preco_privado: inteiro("s-privado"),
        meta_titulo: valor("s-meta"),
        meta_alvo: inteiro("s-alvo"),
        boas_vindas: valor("s-boas"),
        bloqueadas: valor("s-bloq").split(",").map((t) => t.trim()).filter((t) => t && !vistos.has(t.toLowerCase()) && vistos.add(t.toLowerCase()))
      };
      ["s-privado", "s-meta", "s-alvo", "s-boas", "s-bloq"].forEach((id) => marcarErro(id, ""));
      const campoDoErro = { preco_privado: "s-privado", meta_titulo: "s-meta", meta_alvo: "s-alvo", boas_vindas: "s-boas", bloqueadas: "s-bloq" };
      const botao = document.getElementById("salvar-sala");
      botao.disabled = true;
      try {
        if (S.modoDemo) {
          const erro = (campo, msg) => { throw Object.assign(new Error(msg), { campo }); };
          if (!Number.isInteger(sala.preco_privado) || sala.preco_privado < 1 || sala.preco_privado > 500) erro("preco_privado", "O preço do privado vai de 1 a 500 créditos por minuto.");
          const temMeta = sala.meta_titulo !== "" || sala.meta_alvo !== null;
          if (temMeta && !sala.meta_titulo) erro("meta_titulo", "Dê um título à meta (ou deixe título e valor vazios).");
          if (temMeta && !(Number.isInteger(sala.meta_alvo) && sala.meta_alvo >= 1)) erro("meta_alvo", "A meta vai de 1 a 100000 créditos.");
          const mesma = m.meta && temMeta && m.meta.titulo === sala.meta_titulo && m.meta.alvo === sala.meta_alvo;
          if (temMeta && !mesma) LV.gravar("lv_meta_" + m.slug, 0); // meta nova começa do zero
          LVSalas.salvarDemo(m.slug, {
            preco_privado: sala.preco_privado,
            meta: temMeta ? { titulo: sala.meta_titulo, alvo: sala.meta_alvo, atual: mesma ? m.meta.atual ?? 0 : 0 } : null,
            boas_vindas: sala.boas_vindas,
            bloqueadas: sala.bloqueadas.map((t) => t.toLowerCase())
          });
        } else {
          const r = await LV.api("modelo-sala.php", sala);
          LVSalas.aplicar({ [m.slug]: r.sala });
        }
        LV.toast("Sala salva! Já vale no site.");
        conteudo.innerHTML = secoes.sala();
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        if (err.campo) marcarErro(campoDoErro[err.campo] || err.campo, err.message);
        LV.toast(err.message);
        botao.disabled = false;
      }
    });

    // ---------- Meu perfil (api/modelo-perfil.php) ----------
    function marcarErro(id, msg) {
      const campo = document.getElementById(id)?.closest(".campo");
      if (!campo) return;
      campo.classList.toggle("erro", !!msg);
      campo.querySelector(".msg-erro")?.remove();
      if (msg) campo.insertAdjacentHTML("beforeend", `<span class="msg-erro">${esc(msg)}</span>`);
    }
    conteudo.addEventListener("submit", async (e) => {
      if (e.target.id !== "form-perfil") return;
      e.preventDefault();
      const valor = (id) => document.getElementById(id).value;
      // Sem vazios e sem repetidos (maiúsculas não contam; fica a primeira grafia), igual ao servidor.
      const lista = (id) => {
        const vistos = new Set();
        return valor(id).split(",").map((t) => t.trim().replace(/\s+/g, " "))
          .filter((t) => t && !vistos.has(t.toLowerCase()) && vistos.add(t.toLowerCase()));
      };
      const perfil = { nome: valor("p-nome").trim(), cidade: valor("p-cidade").trim(), bio: valor("p-bio").trim(), tags: lista("p-tags"), idiomas: lista("p-idiomas") };
      ["p-nome", "p-cidade", "p-bio", "p-tags", "p-idiomas"].forEach((id) => marcarErro(id, ""));
      const botao = document.getElementById("salvar-perfil");
      botao.disabled = true;
      try {
        if (S.modoDemo) {
          if (perfil.nome.length < 2) throw Object.assign(new Error("O nome artístico precisa ter de 2 a 40 caracteres."), { campo: "nome" });
          if (!perfil.idiomas.length) throw Object.assign(new Error("Informe de 1 a 5 idiomas."), { campo: "idiomas" });
          LVPerfis.salvarDemo(m.slug, perfil);
        } else {
          const r = await LV.api("modelo-perfil.php", perfil);
          LVPerfis.aplicar({ [m.slug]: r.perfil });
        }
        LV.toast("Perfil salvo! Já aparece no site.");
        conteudo.innerHTML = secoes.perfil(); // mostra como ficou salvo (ex.: interesses repetidos somem)
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        if (err.campo) marcarErro("p-" + err.campo, err.message);
        LV.toast(err.message);
        botao.disabled = false;
      }
    });
    conteudo.addEventListener("submit", async (e) => {
      if (e.target.id !== "form-senha") return;
      e.preventDefault();
      const atual = document.getElementById("senha-atual").value;
      const nova = document.getElementById("senha-nova").value;
      if (nova.length < 8) return LV.toast("A nova senha precisa de 8 caracteres ou mais.");
      if (S.modoDemo) { e.target.reset(); return LV.toast("Senha trocada (demonstração)."); }
      try {
        await LV.api("modelo-senha.php", { senha_atual: atual, senha_nova: nova });
        e.target.reset();
        LV.toast("Senha trocada!");
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        LV.toast(err.message);
      }
    });
    conteudo.addEventListener("click", async (e) => {
      if (e.target.id !== "sair-modelo") return;
      if (aoVivo) await definirAoVivo(false).catch(() => {}); // quem sai fecha a sala
      if (S.modoDemo) LV.gravar("lv_modelo_demo", "");
      else await LV.api("modelo-sair.php", {}).catch(() => {});
      location.replace("modelo-entrar.html");
    });

    // Confere o login da modelo antes de mostrar qualquer coisa.
    async function verificar() {
      if (S.modoDemo) {
        try { conta = JSON.parse(LV.ler("lv_modelo_demo", "") || "null"); } catch { conta = null; }
      } else {
        try { conta = (await LV.api("modelo-eu.php")).modelo; } catch { conta = null; }
      }
      m = conta && window.MODELOS.find((x) => x.slug === conta.slug);
      if (!m) return location.replace("modelo-entrar.html");
      await LVPerfis.carregar(); // os formulários abrem com o que está salvo, não com o de modelos.js
      await LVSalas.carregar();
      await carregarAoVivo();
      // Painel reaberto com a sala ligada: volta a avisar o servidor que continua aberto.
      if (aoVivo && !S.modoDemo) await definirAoVivo(true).catch(() => {});
      document.getElementById("painel").hidden = false;
      window.addEventListener("hashchange", abrir);
      abrir();
    }
    verificar();
  </script>
</body>
</html>
