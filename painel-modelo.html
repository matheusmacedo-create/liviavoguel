<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área da modelo</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container conta" id="painel" hidden>
    <nav class="lateral" id="lateral">
      <a href="#inicio">Painel</a>
      <a href="#transmitir">Transmitir</a>
      <a href="#ganhos">Ganhos</a>
      <a href="#perfil">Meu perfil</a>
      <a href="#sala">Configurar sala</a>
      <a href="#seguranca">Senha e acesso</a>
    </nav>
    <section id="conteudo"></section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/modelos.js"></script>
  <script src="assets/js/perfis.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    /*
     * ÁREA DA MODELO
     * Só abre com o login da modelo (modelo-entrar.html → api/modelo-entrar.php), que é
     * separado do login de cliente. Ganhos, status e edição do perfil ainda são visuais:
     * quando ganharem endpoints, cada um confere a sessão da modelo no servidor (lv_exigir_modelo).
     */
    LV.montar("");
    const { esc, reais } = LV;
    const S = window.SITE;
    let conta = null; // { slug, nome, email } da modelo logada
    let m = null;     // dados públicos dela, de modelos.js
    const conteudo = document.getElementById("conteudo");
    // ---------- Ao vivo (api/modelo-ao-vivo.php) ----------
    // Ligado, o painel avisa o servidor a cada minuto que continua aberto. Se a modelo fechar
    // o painel sem desligar, o site a mostra offline sozinho em 5 minutos (LV_AO_VIVO_VALIDADE).
    let aoVivo = false;
    let avisos = null;
    const online = () => aoVivo;

    async function carregarAoVivo() {
      if (S.modoDemo) return (aoVivo = LV.ler("lv_painel_online", m.online ? "1" : "0") === "1");
      try {
        const r = await fetch("api/ao-vivo.php", { credentials: "same-origin" }).then((x) => x.json());
        aoVivo = !!(r.modelos && r.modelos[m.slug] && r.modelos[m.slug].online);
      } catch { aoVivo = false; }
      return aoVivo;
    }

    async function definirAoVivo(ligar) {
      if (S.modoDemo) LV.gravar("lv_painel_online", ligar ? "1" : "0");
      else aoVivo = (await LV.api("modelo-ao-vivo.php", { online: ligar })).online;
      if (S.modoDemo) aoVivo = ligar;
      clearInterval(avisos);
      if (aoVivo && !S.modoDemo) {
        avisos = setInterval(() => {
          LV.api("modelo-ao-vivo.php", { online: true }).catch((err) => {
            if (err.status === 401) location.replace("modelo-entrar.html");
          });
        }, 60000);
      }
      return aoVivo;
    }

    // ---------- Ganhos (api/modelo-ganhos.php) ----------
    // O servidor soma as gorjetas e os minutos de privado que a modelo recebeu e converte
    // para reais pelo repasse (MODELO_REPASSE_CENTAVOS no config.php). No modo demonstração,
    // a conta é feita aqui com o extrato simulado deste navegador.
    const PERIODOS = { "7d": "Últimos 7 dias", mes: "Este mês", mes_passado: "Mês passado" };
    let periodo = "7d";
    let ganhos = null; // última resposta de modelo-ganhos.php
    const dinheiro = (centavos) => reais(centavos / 100);
    const tipoTexto = (t) => (t === "privado" ? "Privado (1 min)" : "Gorjeta");
    // Sempre no horário de Brasília, como as somas de "hoje" e "este mês" no servidor.
    const horaBrasilia = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" });

    function ganhosDemo(nome) {
      const repasse = 20;
      const agora = new Date();
      const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
      const inicio = { "7d": new Date(hoje - 6 * 864e5), mes: new Date(agora.getFullYear(), agora.getMonth(), 1),
        mes_passado: new Date(agora.getFullYear(), agora.getMonth() - 1, 1) };
      const fim = { mes_passado: new Date(agora.getFullYear(), agora.getMonth(), 1) };
      const recebidos = LV.extrato()
        .filter((l) => l.valor < 0 && l.descricao.includes(m.nome))
        .map((l) => ({ data: l.data, tipo: l.descricao.startsWith("Show privado") ? "privado" : "gorjeta",
          cliente: (LV.usuario() || {}).apelido || "você", creditos: -l.valor, centavos: -l.valor * repasse }));
      const soma = (de, ate, tipo) => {
        const lista = recebidos.filter((l) => (!de || new Date(l.data) >= de) && (!ate || new Date(l.data) < ate) && (!tipo || l.tipo === tipo));
        const creditos = lista.reduce((t, l) => t + l.creditos, 0);
        return { creditos, centavos: creditos * repasse, quantidade: lista.length, lista };
      };
      const p = soma(inicio[nome], fim[nome]);
      return {
        repasse_centavos: repasse,
        resumo: { hoje: soma(hoje), mes: soma(inicio.mes), total: soma(), privado_mes: soma(inicio.mes, null, "privado") },
        periodo: { nome, soma: p, lancamentos: p.lista },
        ultimas: recebidos.slice(0, 5)
      };
    }

    async function carregarGanhos() {
      if (S.modoDemo) return (ganhos = ganhosDemo(periodo));
      try {
        ganhos = await LV.api("modelo-ganhos.php?periodo=" + encodeURIComponent(periodo));
      } catch (err) {
        if (err.status === 401) location.replace("modelo-entrar.html");
        ganhos = null;
        LV.toast(err.message);
      }
      return ganhos;
    }

    function tabelaGanhos(lista, vazio) {
      if (!lista.length) return `<div class="vazio"><div class="icone">💸</div>${vazio}</div>`;
      return `<div class="tabela-rolagem"><table class="tabela">
        <thead><tr><th>Data</th><th>De</th><th>Tipo</th><th class="col-opcional" style="text-align:right">Créditos</th><th style="text-align:right">Você recebe</th></tr></thead>
        <tbody>${lista.map((l) => `
          <tr><td>${horaBrasilia(l.data)}</td><td>${esc(l.cliente)}</td><td>${tipoTexto(l.tipo)}</td>
          <td class="col-opcional" style="text-align:right">${l.creditos}</td><td style="text-align:right;white-space:nowrap" class="mais">${dinheiro(l.centavos)}</td></tr>`).join("")}
        </tbody></table></div>`;
    }
    const semGanhos = `<div class="vazio"><div class="icone">⚠️</div>Não foi possível carregar os ganhos agora. <a class="link" href="#" data-recarregar>Tentar de novo</a></div>`;

    const secoes = {
      inicio: () => `
        <div class="painel-topo">
          <h1>Olá, ${esc(m.nome.split(" ")[0])} 👋</h1>
          <label class="chave"><input type="checkbox" id="status" ${online() ? "checked" : ""}><span class="trilho"></span><span id="status-txt">${online() ? "Ao vivo" : "Offline"}</span></label>
        </div>
        <div class="ajuda" id="status-ajuda" style="color:var(--texto-2);font-size:.85rem;margin:-6px 0 16px">
          ${online() ? "Sua sala aparece como ao vivo no site. Deixe esta página aberta enquanto estiver transmitindo." : "Ligue quando começar a transmitir. Sua sala passa a aparecer como ao vivo no site."}
        </div>
        ${ganhos ? `
        <div class="cards-numeros">
          <div class="numero destaque"><small>Ganhos hoje</small><strong>${dinheiro(ganhos.resumo.hoje.centavos)}</strong></div>
          <div class="numero"><small>Ganhos no mês</small><strong>${dinheiro(ganhos.resumo.mes.centavos)}</strong></div>
          <div class="numero"><small>Gorjetas no mês</small><strong>${ganhos.resumo.mes.quantidade - ganhos.resumo.privado_mes.quantidade}</strong></div>
          <div class="numero"><small>Minutos de privado (mês)</small><strong>${ganhos.resumo.privado_mes.quantidade}</strong></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Últimos recebimentos</h2><a class="link" href="#ganhos">Ver tudo</a></div>
          ${tabelaGanhos(ganhos.ultimas, "Nenhuma gorjeta ainda. Elas aparecem aqui quando você estiver ao vivo.")}
        </div>` : semGanhos}
        <div class="painel">
          <h2>Próximas transmissões</h2>
          <ul class="lista-agenda">${m.agenda.map((a) => `<li><span>${esc(a.dia)}</span><strong>${esc(a.hora)}</strong></li>`).join("")}</ul>
        </div>`,

      transmitir: () => `
        <div class="painel">
          <h2>Como transmitir pelo OBS</h2>
          <ol class="instrucoes" style="margin-top:0">
            <li>Instale o <strong>OBS Studio</strong> (grátis) no computador.</li>
            <li>No OBS, vá em <strong>Configurações → Transmissão</strong> e escolha <strong>Personalizado</strong>.</li>
            <li>Cole o <strong>Servidor</strong> e a <strong>Chave de transmissão</strong> abaixo.</li>
            <li>Clique em <strong>Iniciar transmissão</strong>. Em alguns segundos você aparece como ao vivo.</li>
          </ol>
        </div>
        <div class="painel">
          <h2>Dados de transmissão</h2>
          <div class="campo"><label>Servidor (RTMP)</label>
            <div class="segredo"><input readonly value="rtmp://servidor-de-streaming/live" id="rtmp"><button class="btn btn-pequeno" data-copiar="rtmp">Copiar</button></div></div>
          <div class="campo"><label>Chave de transmissão</label>
            <div class="segredo"><input readonly type="password" value="chave-sera-gerada-pelo-servico" id="chave"><button class="btn btn-pequeno" id="mostrar">Mostrar</button><button class="btn btn-pequeno" data-copiar="chave">Copiar</button></div>
            <span class="ajuda">Nunca compartilhe a chave. Com ela, qualquer pessoa transmite na sua sala.</span></div>
          <p style="color:var(--texto-2);font-size:.85rem">Esses dados são preenchidos quando o serviço de streaming for contratado.</p>
        </div>
        <div class="painel">
          <h2>Configuração recomendada</h2>
          <div class="privado-info" style="margin:0">
            <div><span>Resolução</span><strong>1280×720 (720p)</strong></div>
            <div><span>Taxa de quadros</span><strong>30 fps</strong></div>
            <div><span>Bitrate de vídeo</span><strong>2500 a 3500 kbps</strong></div>
            <div><span>Internet de upload mínima</span><strong>5 Mbps</strong></div>
          </div>
        </div>`,

      ganhos: () => !ganhos ? semGanhos : `
        <div class="cards-numeros">
          <div class="numero destaque"><small>Hoje</small><strong>${dinheiro(ganhos.resumo.hoje.centavos)}</strong></div>
          <div class="numero"><small>Este mês</small><strong>${dinheiro(ganhos.resumo.mes.centavos)}</strong></div>
          <div class="numero"><small>Total desde o início</small><strong>${dinheiro(ganhos.resumo.total.centavos)}</strong></div>
        </div>
        <div class="painel">
          <div class="painel-topo"><h2>Extrato</h2>
            <select class="btn btn-pequeno" id="periodo" aria-label="Período">
              ${Object.entries(PERIODOS).map(([v, t]) => `<option value="${v}" ${v === periodo ? "selected" : ""}>${t}</option>`).join("")}
            </select></div>
          <div class="privado-info" style="margin:0 0 14px">
            <div><span>${PERIODOS[periodo]}</span><strong>${ganhos.periodo.soma.creditos} créditos · ${dinheiro(ganhos.periodo.soma.centavos)}</strong></div>
          </div>
          ${tabelaGanhos(ganhos.periodo.lancamentos, "Nenhum ganho neste período.")}
          <p style="color:var(--texto-2);font-size:.85rem;margin-top:12px">Cada crédito recebido vale ${dinheiro(ganhos.repasse_centavos)} para você. Horários de Brasília.</p>
        </div>
        <div class="painel">
          <h2>Dados para saque (Pix)</h2>
          <p style="color:var(--texto-2);font-size:.9rem;margin-bottom:14px">Por enquanto, os saques são combinados com a equipe do site.</p>
          <div class="linha">
            <div class="campo"><label for="tipo-chave">Tipo de chave</label><select id="tipo-chave"><option>CPF</option><option>E-mail</option><option>Celular</option><option>Aleatória</option></select></div>
            <div class="campo"><label for="chave-pix">Chave Pix</label><input id="chave-pix"></div>
          </div>
          <button class="btn btn-primario" data-salvar>Salvar</button>
        </div>`,

      perfil: () => `
        <form class="painel" id="form-perfil" novalidate>
          <h2>Meu perfil</h2>
          <p style="color:var(--texto-2);margin-bottom:14px">O que você salvar aqui aparece na página inicial e na sua sala.</p>
          <div class="linha">
            <div class="campo"><label for="p-nome">Nome artístico</label><input id="p-nome" value="${esc(m.nome)}" maxlength="40"></div>
            <div class="campo"><label for="p-cidade">Cidade</label><input id="p-cidade" value="${esc(m.cidade)}" maxlength="60"></div>
          </div>
          <div class="campo"><label for="p-bio">Sobre mim</label><textarea id="p-bio" maxlength="600">${esc(m.bio)}</textarea><span class="ajuda">Até 600 caracteres</span></div>
          <div class="linha">
            <div class="campo"><label for="p-tags">Interesses (separados por vírgula)</label><input id="p-tags" value="${esc(m.tags.join(", "))}"><span class="ajuda">Até 10</span></div>
            <div class="campo"><label for="p-idiomas">Idiomas (separados por vírgula)</label><input id="p-idiomas" value="${esc(m.idiomas.join(", "))}"><span class="ajuda">De 1 a 5</span></div>
          </div>
          <div class="campo"><label>Fotos</label>
            <div class="galeria">${[m.foto, ...m.galeria].map((f) => `<img src="${esc(f)}" alt="">`).join("")}</div>
            <span class="ajuda">O envio de fotos pelo painel ainda não existe. Por enquanto, troque os arquivos em assets/img/.</span></div>
          <button class="btn btn-primario" id="salvar-perfil">Salvar perfil</button>
        </form>`,

      seguranca: () => `
        <form class="painel" id="form-senha" novalidate>
          <h2>Trocar senha</h2>
          <p style="color:var(--texto-2);margin-bottom:14px">Você está conectada como <strong>${esc(conta.email)}</strong>.</p>
          <div class="linha">
            <div class="campo"><label for="senha-atual">Senha atual</label><input id="senha-atual" type="password" autocomplete="current-password"></div>
            <div class="campo"><label for="senha-nova">Nova senha</label><input id="senha-nova" type="password" autocomplete="new-password" minlength="8"><span class="ajuda">8 caracteres ou mais</span></div>
          </div>
          <button class="btn btn-primario">Trocar senha</button>
        </form>
        <div class="painel">
          <h2>Sair</h2>
          <p style="color:var(--texto-2);margin-bottom:14px">Por segurança, o acesso vence sozinho em 12 horas. Em computador de outra pessoa, saia sempre ao terminar.</p>
          <button class="btn perigo" id="sair-modelo">Sair da área da modelo</button>
        </div>`,

      sala: () => `
        <form class="painel" novalidate>
          <h2>Configurar sala</h2>
          <div class="linha">
            <div class="campo"><label for="s-privado">Preço do privado (créditos/min)</label><input id="s-privado" type="number" min="1" value="${m.precoPrivado}"></div>
            <div class="campo"><label for="s-alvo">Meta de gorjetas (créditos)</label><input id="s-alvo" type="number" min="1" value="${m.meta?.alvo ?? ""}"></div>
          </div>
          <div class="campo"><label for="s-meta">Título da meta</label><input id="s-meta" value="${esc(m.meta?.titulo ?? "")}" maxlength="60"></div>
          <div class="campo"><label for="s-boas">Mensagem de boas-vindas no chat</label><input id="s-boas" maxlength="120" placeholder="Bem-vindo(a) à minha sala! 💜"></div>
          <div class="campo"><label for="s-bloq">Palavras bloqueadas no chat (separadas por vírgula)</label><input id="s-bloq" placeholder="ex.: telefone, whatsapp"></div>
          <button class="btn btn-primario" data-salvar>Salvar</button>
        </form>`
    };

    async function abrir() {
      const nome = location.hash.slice(1) in secoes ? location.hash.slice(1) : "inicio";
      document.querySelectorAll("#lateral a").forEach((a) => a.classList.toggle("ativo", a.hash === "#" + nome));
      if (nome === "inicio" || nome === "ganhos") {
        conteudo.innerHTML = `<div class="vazio"><span class="girando" style="display:inline-block"></span><br>Carregando seus ganhos...</div>`;
        await carregarGanhos();
        if ((location.hash.slice(1) || "inicio") !== nome && location.hash.slice(1) in secoes) return; // trocou de aba enquanto carregava
      }
      conteudo.innerHTML = secoes[nome]();
    }

    conteudo.addEventListener("change", async (e) => {
      if (e.target.id !== "periodo") return;
      periodo = e.target.value;
      abrir();
    });
    conteudo.addEventListener("click", (e) => {
      if (e.target.closest("[data-recarregar]")) { e.preventDefault(); abrir(); }
      if (e.target.closest("[data-salvar]")) { e.preventDefault(); LV.toast("Salvar fica ativo quando o backend estiver pronto. Por enquanto edite assets/js/modelos.js."); }
      const c = e.target.closest("[data-copiar]");
      if (c) { navigator.clipboard?.writeText(document.getElementById(c.dataset.copiar).value); LV.toast("Copiado!"); }
      if (e.target.id === "mostrar") {
        const k = document.getElementById("chave");
        k.type = k.type === "password" ? "text" : "password";
        e.target.textContent = k.type === "password" ? "Mostrar" : "Ocultar";
      }
    });
    conteudo.addEventListener("change", async (e) => {
      if (e.target.id !== "status") return;
      const chave = e.target;
      const ligar = chave.checked;
      chave.disabled = true;
      try {
        await definirAoVivo(ligar);
        LV.toast(aoVivo ? "Você está ao vivo!" : "Sala fechada.");
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        LV.toast(err.message);
      }
      chave.disabled = false;
      chave.checked = aoVivo;
      document.getElementById("status-txt").textContent = aoVivo ? "Ao vivo" : "Offline";
      document.getElementById("status-ajuda").textContent = aoVivo
        ? "Sua sala aparece como ao vivo no site. Deixe esta página aberta enquanto estiver transmitindo."
        : "Ligue quando começar a transmitir. Sua sala passa a aparecer como ao vivo no site.";
    });
    // ---------- Meu perfil (api/modelo-perfil.php) ----------
    function marcarErro(id, msg) {
      const campo = document.getElementById(id)?.closest(".campo");
      if (!campo) return;
      campo.classList.toggle("erro", !!msg);
      campo.querySelector(".msg-erro")?.remove();
      if (msg) campo.insertAdjacentHTML("beforeend", `<span class="msg-erro">${esc(msg)}</span>`);
    }
    conteudo.addEventListener("submit", async (e) => {
      if (e.target.id !== "form-perfil") return;
      e.preventDefault();
      const valor = (id) => document.getElementById(id).value;
      // Sem vazios e sem repetidos (maiúsculas não contam; fica a primeira grafia), igual ao servidor.
      const lista = (id) => {
        const vistos = new Set();
        return valor(id).split(",").map((t) => t.trim().replace(/\s+/g, " "))
          .filter((t) => t && !vistos.has(t.toLowerCase()) && vistos.add(t.toLowerCase()));
      };
      const perfil = { nome: valor("p-nome").trim(), cidade: valor("p-cidade").trim(), bio: valor("p-bio").trim(), tags: lista("p-tags"), idiomas: lista("p-idiomas") };
      ["p-nome", "p-cidade", "p-bio", "p-tags", "p-idiomas"].forEach((id) => marcarErro(id, ""));
      const botao = document.getElementById("salvar-perfil");
      botao.disabled = true;
      try {
        if (S.modoDemo) {
          if (perfil.nome.length < 2) throw Object.assign(new Error("O nome artístico precisa ter de 2 a 40 caracteres."), { campo: "nome" });
          if (!perfil.idiomas.length) throw Object.assign(new Error("Informe de 1 a 5 idiomas."), { campo: "idiomas" });
          LVPerfis.salvarDemo(m.slug, perfil);
        } else {
          const r = await LV.api("modelo-perfil.php", perfil);
          LVPerfis.aplicar({ [m.slug]: r.perfil });
        }
        LV.toast("Perfil salvo! Já aparece no site.");
        conteudo.innerHTML = secoes.perfil(); // mostra como ficou salvo (ex.: interesses repetidos somem)
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        if (err.campo) marcarErro("p-" + err.campo, err.message);
        LV.toast(err.message);
        botao.disabled = false;
      }
    });
    conteudo.addEventListener("submit", async (e) => {
      if (e.target.id !== "form-senha") return;
      e.preventDefault();
      const atual = document.getElementById("senha-atual").value;
      const nova = document.getElementById("senha-nova").value;
      if (nova.length < 8) return LV.toast("A nova senha precisa de 8 caracteres ou mais.");
      if (S.modoDemo) { e.target.reset(); return LV.toast("Senha trocada (demonstração)."); }
      try {
        await LV.api("modelo-senha.php", { senha_atual: atual, senha_nova: nova });
        e.target.reset();
        LV.toast("Senha trocada!");
      } catch (err) {
        if (err.status === 401) return location.replace("modelo-entrar.html");
        LV.toast(err.message);
      }
    });
    conteudo.addEventListener("click", async (e) => {
      if (e.target.id !== "sair-modelo") return;
      if (aoVivo) await definirAoVivo(false).catch(() => {}); // quem sai fecha a sala
      if (S.modoDemo) LV.gravar("lv_modelo_demo", "");
      else await LV.api("modelo-sair.php", {}).catch(() => {});
      location.replace("modelo-entrar.html");
    });

    // Confere o login da modelo antes de mostrar qualquer coisa.
    async function verificar() {
      if (S.modoDemo) {
        try { conta = JSON.parse(LV.ler("lv_modelo_demo", "") || "null"); } catch { conta = null; }
      } else {
        try { conta = (await LV.api("modelo-eu.php")).modelo; } catch { conta = null; }
      }
      m = conta && window.MODELOS.find((x) => x.slug === conta.slug);
      if (!m) return location.replace("modelo-entrar.html");
      await LVPerfis.carregar(); // o formulário abre com o perfil salvo, não com o de modelos.js
      await carregarAoVivo();
      // Painel reaberto com a sala ligada: volta a avisar o servidor que continua aberto.
      if (aoVivo && !S.modoDemo) await definirAoVivo(true).catch(() => {});
      document.getElementById("painel").hidden = false;
      window.addEventListener("hashchange", abrir);
      abrir();
    }
    verificar();
  </script>
</body>
</html>
